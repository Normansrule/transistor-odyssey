<text x="548" y="174.0" fill="#e8ecf1" font-size="12.5">Schottky metal (Mo, Pt, Zr)</text>
<polyline points="265.0,230.0 522.0,230.0 540.0,230.0" fill="none" stroke="#8a94a3" stroke-width="1"/>
<circle cx="265.0" cy="230.0" r="2.6" fill="#e8ecf1" stroke="#10141a" stroke-width="1.5"/>
<text x="548" y="234.0" fill="#e8ecf1" font-size="12.5">p⁻ drift layer (~1e15–16 cm⁻³)</text>
<polyline points="85.0,270.0 522.0,270.0 540.0,270.0" fill="none" stroke="#8a94a3" stroke-width="1"/>
