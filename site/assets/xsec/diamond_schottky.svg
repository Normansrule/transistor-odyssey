<text x="548" y="309.0" fill="#e8ecf1" font-size="12.5">p⁺ boron layer (~1e20 cm⁻³)</text>
<polyline points="265.0,362.0 522.0,362.0 540.0,362.0" fill="none" stroke="#8a94a3" stroke-width="1"/>
