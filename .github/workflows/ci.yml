name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - name: Regenerate figures and site data
        run: make figures
      - name: Physics and data tests (includes JS-vs-Python parity)
        run: make test
      - name: SPICE netlists
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ngspice
          make spice
