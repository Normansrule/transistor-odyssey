<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" role="img" aria-label="Junctionless nanowire transistor (Colinge 2010)">
<rect width="840" height="420" rx="14" fill="#10141a"/>
<text x="24" y="36" fill="#e8ecf1" font-size="19" font-weight="600">Junctionless nanowire transistor (Colinge 2010)</text>
<text x="24" y="58" fill="#8a94a3" font-size="12.5">Source, channel and drain doped the same: the gate simply squeezes the wire until it empties.</text>
