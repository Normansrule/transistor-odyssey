<circle cx="265.0" cy="265.0" r="2.6" fill="#e8ecf1" stroke="#10141a" stroke-width="1.5"/>
<text x="548" y="269.0" fill="#e8ecf1" font-size="12.5">Uniformly n⁺ silicon nanowire</text>
<polyline points="265.0,265.0 522.0,295.0 540.0,295.0" fill="none" stroke="#8a94a3" stroke-width="1"/>
<circle cx="265.0" cy="265.0" r="2.6" fill="#e8ecf1" stroke="#10141a" stroke-width="1.5"/>
