<rect x="210.0" y="288.0" width="110.0" height="12.0" rx="0" fill="#e2b650" fill-opacity="1.0"/>
<polyline points="265.0,227.0 522.0,227.0 540.0,227.0" fill="none" stroke="#8a94a3" stroke-width="1"/>
